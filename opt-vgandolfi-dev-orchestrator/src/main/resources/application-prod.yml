# =============================================================================
# Profile prod — overlay do application.yml base.
# Defaults de hostname apontam para os serviços do docker-compose
# (postgres/rabbitmq/redis/minio). Em k8s/cloud, sobrescreva via env vars —
# todos os valores usam ${VAR:default}, então a env tem a palavra final.
# =============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:opt-vgandolfi-dev}
    username: ${DB_USER:opt-vgandolfi-dev}
    password: ${DB_PASSWORD:opt-vgandolfi-dev}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:opt-vgandolfi-dev}
    password: ${RABBIT_PASSWORD:opt-vgandolfi-dev}

logging:
  level:
    root: INFO

app:
  base-url: ${APP_BACKEND_URL:http://localhost:8080}
  nominatim-url: ${NOMINATIM_URL:https://nominatim.rotaslivres.com.br}
  s3:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET_NAME:opt-vgandolfi-dev}
  rate-limit:
    jobs-per-minute: ${RATE_LIMIT_JOBS_PER_MINUTE:10}
    polls-per-minute: ${RATE_LIMIT_POLLS_PER_MINUTE:600}
    geo-per-minute: ${RATE_LIMIT_GEO_PER_MINUTE:30}