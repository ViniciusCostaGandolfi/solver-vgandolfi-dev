# =============================================================================
# Configuração base (vale para TODOS os profiles). Hierarquia:
#   application.yml      → base com defaults pensados para o STACK LOCAL
#                          (docker compose up -d). Tudo sobrescrevível por env.
#   application-dev.yml  → overlay do profile dev (logging verboso; nenhum valor
#                          fixo que "esconda" env vars).
#   application-prod.yml → overlay do profile prod (defaults = hostnames do
#                          compose: postgres/rabbitmq/redis/minio).
#   application-test.yml → profile de teste (H2 MODE=PostgreSQL, flyway off,
#                          rate-limit baixo).
#
# REGRA DE OURO: em yml de profile, chaves que vêm de env DEVEM usar
# ${VAR:default} — valor fixo no profile sobrescreve o placeholder do base e
# IGNORA a env var (footgun documentado em RateLimitPropertiesBindingTest).
# Precedência: env var > application-{profile}.yml > application.yml.
# =============================================================================
spring:
  application:
    name: orchestrator

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:solver-vgandolfi-dev}
    username: ${DB_USER:solver-vgandolfi-dev}
    password: ${DB_PASSWORD:solver-vgandolfi-dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:solver-vgandolfi-dev}
    password: ${RABBIT_PASSWORD:solver-vgandolfi-dev}

springdoc:
  paths-to-match: /api/v1/**

app:
  base-url: ${APP_BACKEND_URL:http://localhost:8080}
  nominatim-url: ${NOMINATIM_URL:https://nominatim.rotaslivres.com.br}
  opencep-url: ${OPENCEP_URL:https://opencep.rotaslivres.com.br}
  rabbitmq:
    exchange: routing.exchange
    result-queue: routing.result.queue
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET_NAME:solver-vgandolfi-dev}
  rate-limit:
    jobs-per-minute: ${RATE_LIMIT_JOBS_PER_MINUTE:10}
    polls-per-minute: ${RATE_LIMIT_POLLS_PER_MINUTE:600}
    geo-per-minute: ${RATE_LIMIT_GEO_PER_MINUTE:30}
  webhook:
    retry-delays: ${WEBHOOK_RETRY_DELAYS:30s,5m,1h,24h}
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:5}